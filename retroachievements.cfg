# RetroAchievements configuration file

# RetroAchievements credentials
username=
password=

# Show popup when a challenge indicator appears (1=yes, 0=no)
show_challenge_show_popup=1

# Show popup when a challenge indicator disappears / is missed (1=yes, 0=no)
show_challenge_hide_popup=0

# Show popup for achievement progress updates (1=yes, 0=no)
show_progress_popups=1

# Include achievement name in progress popups (1=yes, 0=no)
show_progress_name=1

# Show leaderboard update popups (STARTED, FAILED, TRACKER SHOW/UPDATE) (1=yes, 0=no)
show_leaderboards_updates=1

# Show leaderboard submission popups (SUBMITTED and SCOREBOARD result) (1=yes, 0=no)
show_leaderboards_submission=1

# Where the RetroAchievements pop-ups appear on the top of the screen:
# left (default), center or right. Use "center" when the display crops the
# sides (e.g. HDMI output forced to 4:3 on a TV) and the pop-up gets cut off.
# Any unsupported value falls back to "left".
popup_position=left

# Turn on debug logging (1=yes, 0=no)
debug=0

# Write debug logs from a background thread instead of inline (1=yes, 0=no).
# Only matters when debug=1
async_log=1

# Enable hardcore mode for supported cores (1=yes, 0=no)
hardcore=0

# Force hardcore mode on unsupported cores (1=yes, 0=no)
force_hardcore=0

# Show achievement title and descriptions with two lines of text in the OSD (1=yes, 0=no)
multiline_desc=0

# Scroll the selected achievement's description on a ticker line at the bottom
# of the achievement list (F6 / OSD "Achievements"). The list already shows a
# full-screen detail page for the selected entry (press A/Y); this ticker is an
# extra always-on preview and reserves one list row (1=yes, 0=no [default])
list_desc_ticker=0

# In-game gamepad shortcut to open the achievement list: hold the Menu button
# and press Y (X on xbox controller) during play (opens the list directly instead of the OSD). 
# (1=yes, 0=no [default])
list_hotkey=0